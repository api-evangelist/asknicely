apis:
- name: AskNicely MCP Server (Ask NiceAI)
  description: >-
    AskNicely's remote Model Context Protocol server, exposing Ask NiceAI's tools — NPS summaries, survey
    responses, leaderboards and more — to external AI clients such as Claude. Served per tenant at https://{domain}.asknice.ly/mcp,
    protected by OAuth 2.1 (dynamic client registration, PKCE S256, scope `tools`) with the authorization
    server at https://mcp.asknice.ly. Requires the Ask NiceAI add-on on the AskNicely account.
  humanURL: >-
    https://asknicely.zendesk.com/hc/en-us/articles/51310930486292-Adding-AskNicely-as-a-Custom-Connector-in-Claude
