apis:
- name: AskNicely API
  description: >-
    The AskNicely REST API. Import and update contacts, trigger NPS/CSAT/5-Star surveys, bulk-load
    contacts (JSON or CSV importer), retrieve survey responses in JSON or CSV, read NPS/sent/historical
    statistics, list unsubscribed contacts, deactivate contacts, and process GDPR erasure requests.
    Authenticated with an account API key in the `X-apikey` header. Served from each account's own
    subdomain under /api/v1.
  humanURL: https://demo.asknice.ly/help/apidocs
  baseURL: https://demo.asknice.ly/api/v1
