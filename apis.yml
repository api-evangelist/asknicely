- name: AskNicely In-App Survey API
  description: >-
    Server-to-server endpoint that exchanges an HMAC-SHA256-signed contact identity for a one-time survey
    slug, so an AskNicely survey can be rendered inside your own website or mobile application rather
    than delivered by email or SMS.
  humanURL: https://demo.asknice.ly/help/apidocs/inapp
  baseURL: https://demo.asknice.ly
  tags:
  - Surveys
  - In-App
  - Mobile
  properties:
  - type: OpenAPI
    url: openapi/asknicely-inapp-openapi.yml
  - type: Documentation
    url: https://demo.asknice.ly/help/apidocs/inapp
  - type: SourceCode
    url: https://github.com/asknicely/asknicely-mobile-inapp-samples
- name: AskNicely MCP Server (Ask NiceAI)
  description: >-
    AskNicely's remote Model Context Protocol server, exposing Ask NiceAI's tools — NPS summaries, survey
    responses, leaderboards and more — to external AI clients such as Claude. Served per tenant at
    https://{domain}.asknice.ly/mcp, protected by OAuth 2.1 (dynamic client registration, PKCE S256,
    scope `tools`) with the authorization server at https://mcp.asknice.ly. Requires the Ask NiceAI
    add-on on the AskNicely account.
  humanURL: https://asknicely.zendesk.com/hc/en-us/articles/51310930486292-Adding-AskNicely-as-a-Custom-Connector-in-Claude
  baseURL: https://nicely.asknice.ly/mcp
  tags:
  - MCP
  - AI
  - Agents
  properties:
