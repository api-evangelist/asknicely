aid: asknicely
name: AskNicely
description: >-
  AskNicely is a customer-experience (CX) platform for service businesses, built around Net Promoter
  Score, CSAT and 5-Star surveys delivered by email, SMS, web badge and in-app. It collects frontline
  feedback, routes it to managers and staff through leaderboards, coaching and case management, and
  syndicates positive responses to review sites through its Reputation/Review Manager. Founded in
  Auckland, New Zealand in 2014, AskNicely serves franchise, home-services, healthcare, fitness and
  professional-services operators. Its public REST API (`https://{domain}.asknice.ly/api/v1`) covers
  contact import, survey triggering, response and statistics retrieval, unsubscribe lists and GDPR
  erasure, authenticated with a single `X-apikey` header, and it ships a per-tenant remote MCP server for
  its Ask NiceAI assistant.
