description: >-
  AskNicely's API lifecycle posture. There is one version (v1) and no version-pinning mechanism, so
  changes land in place and are communicated only through the dated API changelog page. AskNicely has
  renamed endpoints and parameters in place (the 2021 person→contact rename) and marks the old forms
  "deprecated" on the changelog without publishing a sunset date, a Deprecation/Sunset header, or a
  formal deprecation policy.
