generated: '2026-08-06'
method: searched
source: https://demo.asknice.ly/help/apidocs
description: >-
  Request and response examples transcribed verbatim from AskNicely's own API reference pages. Every
  example below also lives inline in openapi/asknicely-openapi.yml so a tooling consumer gets them from
  the spec. Values are AskNicely's published sample values — no example has been invented, and none is a
  live credential (the docs render the API key field empty).
examples:
- operation: triggerSurvey
  docs: https://demo.asknice.ly/help/apidocs/survey
  request:
    method: POST
    url: https://DEMO.asknice.ly/api/v1/contact/trigger
    headers: {X-apikey: <your api key>}
    form:
      email: schrodinger@example.com
      name: Erwin Schrodinger
      triggeremail: 'true'
      segment: green
      city_c: portland
  responses:
    sent:
      result:
      - {survey_sent: true, id: '15968', email: schrodinger@example.com, msg: Message Sent}
      success: true
      surveys_sent: 1
    suppressed_by_contact_rules:
      result:
      - survey_sent: false
        id: '15968'
        email: schrodinger@example.com
        msg: >-
          You have already contacted this contact within the period of your contact rules, this request
          will be ignored. Add parameter '&triggeremail=true' to override contract rules and trigger this
          survey.
      success: true
      surveys_sent: 0
    unsubscribed:
      result:
      - survey_sent: false
        id: '15968'
        email: schrodinger@example.com
        msg: This contact has been de-activated or has un-subscribed, your survey will not be sent
      success: true
      surveys_sent: 0
- operation: bulkAddContacts
  docs: https://demo.asknice.ly/help/apidocs/bulkasync
  request:
    method: POST
    url: https://DEMO.asknice.ly/api/v1/contacts/add
    headers: {X-apikey: <your api key>, Content-Type: application/json}
    body:
      contacts:
      - {name: Jane Doe, email: jane@example.com, region: West, account_owner: Sarah}
      - {name: John Smith, email: john@example.com, region: East, account_owner: Tom}
      obeyrules: true
  responses:
    '201': {success: true}
    '400_no_data': {success: false, msg: no data found}
    '400_not_array': {success: false, msg: 'if set, contacts must be an array'}
    '500': {success: false, msg: Internal Server Error}
