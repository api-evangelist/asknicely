description: >-
  Which cross-cutting and industry standards the AskNicely surface conforms to. The REST API is a
  pre-standards, API-key JSON API — no OAuth, no Problem Details, no standard pagination or rate-limit
  headers. The MCP/Ask NiceAI surface is where AskNicely's standards conformance actually lives, and it
  is genuinely current: RFC 8414, RFC 9728, RFC 7591 dynamic client registration and PKCE S256.
standards:
